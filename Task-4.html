<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Cheat Sheet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .example {
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>HTML Cheat Sheet</h1>

    <div class="example">
        <h2>&lt;h1&gt;</h2>
        <h1>This is h1 paragraph</h1>
    </div>

    <div class="example">
        <h2>&lt;p&gt;</h2>
        <p>This is a paragraph</p>
    </div>

    <div class="example">
        <h2>&lt;a&gt;</h2>
        <a href="https://www.google.com">This is a link</a>
    </div>

    <div class="example">
        <h2>&lt;ul&gt;</h2>
        <ul>
            <li>This is an unordered list</li>
            <li>Second item</li>
            <li>Third item</li>
        </ul>
    </div>

    <div class="example">
        <h2>&lt;ol&gt;</h2>
        <ol>
            <li>This is an ordered list</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>
    </div>

    <div class="example">
        <h2>&lt;img&gt;</h2>
        <img alt="this is an alt of img">
    </div>

    <div class="example">
        <h2>&lt;table&gt;</h2>
        <table border="1" align="center">
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Abdulaziz</td>
                <td>19</td>
            </tr>
        </table>
    </div>

</body>
</html>
